<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: full-bleed 3D tabletop on the left, a character sheet docked right (a bottom sheet on phones). */
  :root {
    --table: #16120e;      /* walnut table */
    --panel: #201a14;      /* sheet background */
    --panel-2: #2a221a;    /* raised fields */
    --line: #3e3429;
    --ink: #ece2cf;        /* parchment text */
    --muted: #a6978a;
    --brass: #d3aa55;      /* accent */
    --blood: #d0604b;      /* damage / critical */
    --moss: #86ad6b;       /* healing / good */
    --sky: #7aa7cb;        /* movement */
    --display: "Alegreya SC", Georgia, "Times New Roman", serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--table); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }

  /* HUD over the board */
  .hud { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px;
         display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
          background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
          border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip b { font-weight: 700; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
  .chip .dot.spent { background: transparent; border: 1px solid var(--muted); }
  .chip.map { font-family: var(--display); letter-spacing: .04em; }
  .chip.move b { color: var(--sky); }

  .actions { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 14px;
             display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .actions .row { pointer-events: none; }
  .actions .row > * { pointer-events: auto; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; line-height: 1.2; }
  .btn:hover:not(:disabled) { border-color: var(--brass); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--brass); color: #20180d; border-color: var(--brass); font-weight: 700; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none !important; }

  .spell { --c: var(--brass); display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px 6px 7px;
           background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; }
  .spell .k { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; font-size: 12px;
              background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); font-weight: 700; }
  .spell .lv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spell:hover:not(:disabled) { border-color: var(--c); }
  .spell[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .spell:disabled { opacity: .45; cursor: not-allowed; }

  .toast, .aim { position: absolute; left: 50%; transform: translateX(-50%); max-width: min(460px, calc(100% - 32px));
           background: var(--panel); border: 1px solid var(--brass); border-radius: 8px; padding: 8px 12px;
           font-size: 14px; text-align: center; pointer-events: none; }
  .toast { top: 100px; transition: opacity .25s; }
  .toast.off { opacity: 0; }
  .aim { top: 56px; border-color: var(--c, var(--brass)); }

  #fx { position: absolute; inset: 0; pointer-events: none; }
  .float { position: absolute; transform: translate(-50%, -100%); font: 700 22px/1 var(--display);
           text-shadow: 0 2px 4px #000, 0 0 2px #000; white-space: nowrap; }
  .float.dmg { color: var(--blood); } .float.crit { color: #ffcf6b; font-size: 28px; }
  .float.heal { color: var(--moss); } .float.miss { color: var(--muted); font-size: 18px; }
  .float.xp { color: var(--brass); font-size: 18px; } .float.cold { color: #9fdcff; } .float.vine { color: #a6e07a; font-size: 18px; }

  /* Character sheet */
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0;
           padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
           display: flex; flex-direction: column; gap: 14px; }
  .sheet-head { display: flex; gap: 12px; align-items: center; }
  .swatch { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 2px solid var(--brass); padding: 0; overflow: hidden; background: none; }
  .swatch input { width: 60px; height: 60px; margin: -10px; border: 0; padding: 0; cursor: pointer; background: none; }
  .name-input { width: 100%; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent;
                font: 700 22px/1.15 var(--display); letter-spacing: .02em; padding: 0; }
  .name-input:hover, .name-input:focus { border-bottom-color: var(--line); outline: none; }
  .sub { color: var(--muted); font-size: 14px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; color: var(--muted);
                 font-family: var(--display); letter-spacing: .05em; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }

  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  h3 { margin: 0; font: 700 13px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--brass); }
  .section { display: flex; flex-direction: column; gap: 10px; }
  [id^="tab-"]:not([hidden]) { display: flex; flex-direction: column; gap: 18px; }

  .vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vital { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px; text-align: center; }
  .vital .v { font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .hp { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hp-top { display: flex; justify-content: space-between; align-items: baseline; }
  .hp-top .v { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #120e0b; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--moss); transition: width .3s; }
  .bar.xp > i { background: var(--brass); }
  .hp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hp-row input { width: 64px; background: #120e0b; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

  .abilities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ab { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px 6px; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 2px; }
  button.ab:hover { border-color: var(--brass); }
  .ab .m { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .ab .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .ab .step { display: flex; gap: 4px; margin-top: 4px; }
  .ab .step button { width: 26px; height: 22px; padding: 0; border-radius: 5px; background: #120e0b; border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }

  .attack { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid;
            grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .attack .n { font-weight: 700; }
  .dice { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dice button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; font-family: var(--display); }
  .dice button:hover { border-color: var(--brass); }

  .slots { display: flex; flex-direction: column; gap: 6px; }
  .slot { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; background: var(--panel-2);
          border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .slot .empty { color: var(--muted); font-style: italic; }
  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item .nm { font-weight: 500; min-width: 0; }
  .item .nm .q { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .meta { grid-column: 1; color: var(--muted); font-size: 13px; }
  .item .ctl { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-items: center; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); border: 1px solid var(--brass);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  select { background: #120e0b; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; flex: 1; }

  .castline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pips { display: flex; flex-direction: column; gap: 6px; }
  .pip-row { display: flex; align-items: center; gap: 10px; }
  .pip-row .label { width: 56px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--brass); }
  .pip.on { background: var(--brass); box-shadow: 0 0 8px color-mix(in srgb, var(--brass) 60%, transparent); }
  .spellcard { --c: var(--brass); background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c);
               border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .spellcard .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .spellcard .t b { font: 700 17px/1.1 var(--display); }
  .spellcard p { margin: 0; font-size: 14px; color: var(--muted); }
  .spellcard .facts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toggle { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .toggle input { margin-top: 3px; accent-color: var(--brass); }

  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .log li { background: var(--panel-2); border-left: 3px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .log li.hit { border-left-color: var(--blood); } .log li.crit { border-left-color: #ffcf6b; }
  .log li.heal { border-left-color: var(--moss); } .log li.sys { border-left-color: var(--brass); }
  .log li.spell { border-left-color: #c27bff; }
  .log .r { font-variant-numeric: tabular-nums; color: var(--muted); }
  .log b { color: var(--ink); }
  .muted { color: var(--muted); font-size: 13px; }


  .hud-chips { display: contents; }
  select.chip { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .chip.combat { border-color: var(--blood); color: #ffb3a6; }
  .chip.combat .dot { background: var(--blood); }
  .chip.explore { border-color: color-mix(in srgb, var(--sky) 60%, var(--line)); }
  .chip.target { border-color: var(--blood); }
  .hpbar { position: absolute; width: 46px; height: 6px; transform: translate(-50%, -100%); background: #120e0b;
           border: 1px solid #000; border-radius: 3px; overflow: hidden; }
  .hpbar > i { display: block; height: 100%; background: var(--blood); }
  .hpbar.boss { width: 74px; height: 8px; }
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 6, 4, .62); z-index: 20; padding: 16px; }
  .modal .card { background: var(--panel); border: 1px solid var(--brass); border-radius: 12px; padding: 20px; max-width: 440px;
                 width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal h2 { margin: 0; font: 700 26px/1.1 var(--display); color: var(--brass); text-wrap: balance; }
  .modal p { margin: 0; line-height: 1.5; }
  .modal .inscription { font: italic 17px/1.55 var(--display); color: var(--ink); border-left: 3px solid var(--brass); padding-left: 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
  .stats div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; }
  .tag.curse { color: #c98bff; border-color: #c98bff; }
  .tag.weird { color: #7fd8ff; border-color: #7fd8ff; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .panel { max-height: 45vh; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .hint { display: none; }
    .spell { padding: 5px 8px 5px 5px; font-size: 13px; }
    .spell .lv { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > i, .toast { transition: none; } }
</style>

<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D battle board"></canvas>
    <div id="fx"></div>
    <div class="hud" id="hud"><select class="chip map" id="mapSel" aria-label="Map"></select><span class="hud-chips" id="hudChips"></span></div>
    <div class="aim" id="aim" hidden></div>
    <div class="toast off" id="toast" role="status" aria-live="polite"></div>
    <div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><div id="mBody"></div><div class="row" id="mBtns"></div></div></div>
    <div class="actions">
      <div class="row" id="spellbar"></div>
      <div class="row">
        <button class="btn" id="searchBtn" title="Wisdom (Perception) check to find secret doors, traps and hidden caches within 15 ft">Search</button>
        <button class="btn" id="dashBtn" title="Use your action to double your movement this turn">Dash</button>
        <button class="btn primary" id="endBtn">End turn</button>
        <button class="btn" id="viewBtn" title="Reset the camera">Reset view</button>
        <span class="hint">Click to move or interact · Click an enemy to attack · 1–4 casts · Drag to orbit</span>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Character sheet">
    <div class="sheet-head">
      <label class="swatch" title="Miniature colour"><input type="color" id="charColor" aria-label="Miniature colour"></label>
      <div style="min-width:0;flex:1">
        <input id="charName" class="name-input" aria-label="Character name" maxlength="40">
        <div class="sub" id="charSub"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sheet" aria-selected="true">Sheet</button>
      <button role="tab" data-tab="spells" aria-selected="false">Spells</button>
      <button role="tab" data-tab="inv" aria-selected="false">Inventory</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
    </nav>
    <div id="tab-sheet"></div>
    <div id="tab-spells" hidden></div>
    <div id="tab-inv" hidden></div>
    <div id="tab-log" hidden></div>
  </aside>
</div>

// A painted-miniature look: a warm edge highlight, like drybrushing, on every figure
function paintRim(root, strength = 0.2) {
  root.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      if (!m.isMeshStandardMaterial || m.userData.rim) continue;
      m.userData.rim = true;
      m.onBeforeCompile = sh => {
        sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
          totalEmissiveRadiance += vec3(1.0, 0.9, 0.78) * ${strength.toFixed(2)} * pow(1.0 - saturate(dot(normal, normalize(vViewPosition))), 2.5);`);
      };
      m.customProgramCacheKey = () => 'rim' + strength;
    }
  });
}

function buildCreature(c) {
  const g = new THREE.Group(), pivot = new THREE.Group(); g.add(pivot);
  const m = MONSTERS[c.type];
  g.add(miniBase(m.boss ? 0.95 : 0.82));
  const height = MODELS[c.type](pivot);
  paintRim(g);
  if (m.boss) g.scale.setScalar(1.12);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.43, 0.5, 40), new THREE.MeshBasicMaterial({ color: '#d0604b', transparent: true, opacity: 0.9, side: THREE.DoubleSide, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; ring.userData.noShadow = true; ring.visible = false; g.add(ring);
  tagAll(g, 'creature', { cid: c.id });
  const mats = []; pivot.traverse(o => { if (o.isMesh && o.material.emissive) mats.push(o.material); });
  const bar = document.createElement('div'); bar.className = 'hpbar' + (m.boss ? ' boss' : ''); bar.innerHTML = '<i></i>'; bar.hidden = true;
  $('fx').appendChild(bar);
  scene.add(g);
  const v = { g, pivot, ring, bar, mats, height, anim: null, lunge: 0, lungeDir: new THREE.Vector3(), shake: 0, flash: 0 };
  views.set(c.id, v);
  g.position.copy(worldOf(c.x, c.z));
  if (!c.alive) pivot.rotation.x = -1.35;
  return v;
}
function rebuildCreatures() {
  for (const v of views.values()) { v.g.traverse(o => { if (o.isMesh) o.material.dispose?.(); }); v.g.removeFromParent(); v.bar.remove(); }
  views.clear();
  for (const c of state.creatures) buildCreature(c);
}

function taperedTube(curve, seg, r, radial) {
  const g = new THREE.TubeGeometry(curve, seg, r, radial, false);
  const pos = g.attributes.position, P = new THREE.Vector3(), C = new THREE.Vector3();
  const colors = new Float32Array(pos.count * 3);
  const base = new THREE.Color('#2f5a22'), tip = new THREE.Color('#8fcf5a'), col = new THREE.Color();
  for (let i = 0; i <= seg; i++) {
    const t = i / seg; curve.getPointAt(t, C);
    const k = 1 - 0.82 * t;
    col.copy(base).lerp(tip, t);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      P.fromBufferAttribute(pos, idx).sub(C).multiplyScalar(k).add(C);
      pos.setXYZ(idx, P.x, P.y, P.z);
      colors[idx * 3] = col.r; colors[idx * 3 + 1] = col.g; colors[idx * 3 + 2] = col.b;
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return g;
}

/* --- search --- */

  ring.rotation.x = -Math.PI / 2; ring.position.copy(worldOf(state.pos.x, state.pos.z)).add(new THREE.Vector3(0, 0.03, 0)); scene.add(ring);

}

function attack(c) {

/* --- enemy turns --- */
function pickTile(c, scoreFn) {

  let best = -1, bestS = Infinity;
  for (let i = 0; i < W * H; i++) {

    const x = i % W, z = (i / W) | 0, s = scoreFn(x, z, r.dist[i], field[i]);

}

}

  if (!c.restrained) {

    if (m.ai === 'ranged') {

        const dd = cheb({ x, z }, state.pos);

  const crit = nat === 20, hit = crit || (nat !== 1 && total >= d.ac);
  const rollTxt = `<span class="r">d20${disadv ? ` (disadv. ${r.join(', ')})` : ''} ${nat} ${fmt(m.atk)} = ${total} vs AC ${d.ac}</span>`;
  if (hit) {
    const dice = roll(m.dmg[0] * (crit ? 2 : 1), m.dmg[1]), dmg = sum(dice) + m.dmg[2];

    addLog('sys', `The ${MONSTERS[c.type].name.toLowerCase()} is propped back up.`);
  }
  if (!exploring()) addLog('sys', `Round ${t.round}. Your turn.`);
  refresh(); save();
}

function rollDie(sides) {
  const r = roll(1, sides)[0];
  addLog('', `Rolled <b>d${sides}</b>: <b>${r}</b>`);
  floatText(`d${sides}: ${r}`, above(hero, 1.3), 'xp');
  refresh(); save();
}
function rollCheck(key) {
  const [, label] = ABILITIES.find(a => a[0] === key), m = mod(state.char.abilities[key]), r = roll(1, 20)[0];
  addLog(r === 20 ? 'crit' : '', `<b>${label} check</b>: <b>${r + m}</b> <span class="r">d20 ${r} ${fmt(m)}</span>`);
  floatText(`${label.slice(0, 3)} ${r + m}`, above(hero, 1.3), 'xp');
  refresh(); save();
}

function heal(amount, source) {
  const c = state.char, max = derived().maxHp, before = c.hp;
  c.hp = Math.min(max, c.hp + amount);
  floatText(`+${c.hp - before}`, above(hero, 1.2), 'heal');
  addLog('heal', `${source}: regain <b>${c.hp - before}</b> HP (${c.hp}/${max}).`);
}
function hurtHero(n, what, cls = 'dmg') {
  const c = state.char;
  c.hp = Math.max(0, c.hp - n); heroFlash = 1;
  floatText(`-${n}`, above(hero, 1.2), cls);
  addLog('hit', `${what}: ${c.name} takes <b>${n}</b> (${c.hp}/${derived().maxHp}).`);
  if (c.hp === 0) {
    if (state.creatures.some(cr => MONSTERS[cr.type].ai !== 'none') || state.mapKey === 'crypt') after(0.6, defeat);
    else toast(`${c.name} is at 0 HP. Heal or take a long rest from the sheet.`);
  }
}

/* --- endings --- */
function defeat() {
  if (state.over) return;
  state.over = 'defeat'; busy = false; save();
  showModal('You have fallen', `<p>${state.char.name} collapses on the cold stones of the ${MAP.name}. Somewhere in the dark, something laughs.</p>`, [
    { label: 'Try again', primary: true, fn: () => restartMap(state.mapKey, state.startChar) },
    { label: 'New character', fn: () => restartMap(state.mapKey, null) },
  ]);
}
function victory() {
  const s = state.stats, foes = state.creatures.filter(c => MONSTERS[c.type].ai !== 'none').length;
  addLog('sys', `<b>${state.char.name} escapes the ${MAP.name}!</b>`);
  save();
  showModal(`You escape the ${MAP.name}`, `
    <p>The stairs spiral down into fresh air and grey morning light. You made it out.</p>
    <div class="stats">
      <div><span>Enemies defeated</span><b>${s.kills} / ${foes}</b></div>
      <div><span>Secrets found</span><b>${s.secrets} / 3</b></div>
      <div><span>Gold found</span><b>${s.gold} gp</b></div>
      <div><span>Level</span><b>${state.char.level} (${state.char.xp} XP)</b></div>
    </div>`, [
    { label: 'Play again with this character', primary: true, fn: () => restartMap(state.mapKey, state.char) },
    { label: 'Keep exploring' },
  ]);
}
function restartMap(key, char) {
  cancelSpell(); clearVisuals(); anim = null; busy = false;
  state = freshState(key, char);
  MAP = MAPS[key]; W = MAP.rows[0].length; H = MAP.rows.length;
  state.char.hp = derived().maxHp;
  $('mapSel').value = key;
  bootBoard();
  addLog('sys', `${MAP.name}: ${state.char.name} starts fresh.`);
  refresh(); save();
}

/* --- spells --- */
function templateTiles(key, x, z) {
  const sp = SPELLS[key], out = [];
  const open = (tx, tz) => !isWall(tileAt(tx, tz)) && tx >= 0 && tz >= 0 && tx < W && tz < H;
  if (sp.shape === 'sphere' || sp.shape === 'square') {
    for (let dz = -sp.size; dz <= sp.size; dz++) for (let dx = -sp.size; dx <= sp.size; dx++)
      if ((sp.shape === 'square' || dx * dx + dz * dz <= sp.size * sp.size + 1) && open(x + dx, z + dz)) out.push({ x: x + dx, z: z + dz });
    return { tiles: out };
  }
  const axis = Math.abs(x - state.pos.x) >= Math.abs(z - state.pos.z) ? 'z' : 'x';
  const half = (sp.size - 1) / 2;
  for (let i = -half; i <= half; i++) {
    const tx = axis === 'x' ? x + i : x, tz = axis === 'z' ? z + i : z;
    if (!WALKABLE.has(tileAt(tx, tz)) || (tx === state.pos.x && tz === state.pos.z)) continue;
    if (key === 'icewall' && creatureAt(tx, tz)) continue;
    out.push({ x: tx, z: tz });
  }
  return { tiles: out, axis };
}

function spellHit(sp, c, what, dice) {
  if (!c.alive) return null;
  const d = derived(), bonus = MONSTERS[c.type].saves?.[sp.save] ?? 0, r = roll(1, 20)[0], saved = r + bonus >= d.spellDc;
  const saveTxt = `<span class="r">${sp.save.toUpperCase()} save ${r}${fmt(bonus)} = ${r + bonus} vs DC ${d.spellDc}: ${saved ? 'success' : 'fail'}</span>`;
  const name = MONSTERS[c.type].name.toLowerCase();
  if (sp.damage) {
    const full = sum(dice), dmg = saved ? Math.floor(full / 2) : full;
    addLog('hit', `${what} the ${name} for <b>${dmg}</b> ${sp.dmgType}${saved ? ' (half)' : ''}. ${saveTxt}`);
    damageCreature(c, dmg, sp.dmgType === 'cold' ? 'cold' : 'dmg');
  } else {
    if (MONSTERS[c.type].ai !== 'none' && !c.aware) { const was = exploring(); c.aware = true; if (was) startCombat(); }
    if (!saved) { c.restrained = true; addLog('spell', `Vines seize the ${name}. It is <b>restrained</b>. ${saveTxt}`); floatText('Restrained', creatureTop(c), 'vine'); }
    else addLog('spell', `The ${name} tears free of the vines. ${saveTxt}`);
  }
  return saved;
}

function selectSpell(key) {
  if (busy || anim || state.over) return;
  if (ui.spell === key) return cancelSpell();
  const sp = SPELLS[key];
  if (!ui.sandbox) {
    if (!state.turn.action) return toast('Casting a spell uses your action, and it is already spent.');
    if (state.char.slots[sp.level].left <= 0) return toast(`No level ${sp.level} spell slots left. Take a long rest on the Sheet tab.`);
  }
  ui.spell = key; ui.aim = null; clearPath();
  const aim = $('aim'); aim.hidden = false; aim.style.setProperty('--c', sp.color);
  aim.textContent = `${sp.name}: ${window.matchMedia('(pointer: coarse)').matches ? 'tap a square, then tap it again to cast' : 'click a square'} within ${sp.range * 5} ft. Esc cancels.`;
  refresh();
}
function cancelSpell() { if (!ui.spell) return; ui.spell = null; ui.aim = null; $('aim').hidden = true; clearPath(); refresh(); }

function previewSpell(t) {
  for (const o of overlays) if (o) o.visible = false;
  ui.aim = t;
  if (!t) { hoverBox.visible = false; return; }
  const sp = SPELLS[ui.spell], inRange = cheb(state.pos, t) <= sp.range;
  const { tiles } = templateTiles(ui.spell, t.x, t.z);
  for (const tl of tiles) {
    const o = overlays[tl.z * W + tl.x]; if (!o || !state.explored[tl.z * W + tl.x]) continue;
    o.visible = true; o.material.color.set(inRange ? sp.color : '#a33a2a'); o.material.opacity = 0.42;
  }
  const p = worldOf(t.x, t.z); hoverBox.position.set(p.x, Math.max(p.y, 0.2) + 0.01, p.z); hoverBox.visible = true;
}

function cast(key, x, z) {
  const sp = SPELLS[key];
  if (cheb(state.pos, { x, z }) > sp.range) return toast(`Out of range. ${sp.name} reaches ${sp.range * 5} ft.`);
  const { tiles, axis } = templateTiles(key, x, z);
  if (!tiles.length) return toast('There is no open ground there.');
  if (!ui.sandbox) {
    if (!state.turn.action) return toast('Casting a spell uses your action, and it is already spent.');
    const slot = state.char.slots[sp.level];
    if (slot.left <= 0) return toast(`No level ${sp.level} spell slots left.`);
    slot.left--; state.turn.action = false;
  }
  ui.spell = null; ui.aim = null; $('aim').hidden = true; clearPath();
  busy = true; faceAt = worldOf(x, z);
  castCircle(worldOf(state.pos.x, state.pos.z), sp.color, key === 'fireball' ? (reduceMotion ? 0.3 : 1.0) : 0.7);
  addLog('spell', `<b>${state.char.name}</b> casts <b>${sp.name}</b>${ui.sandbox ? '' : ` using a level ${sp.level} slot`}.`);
  const inTiles = p => tiles.some(t => t.x === p.x && t.z === p.z);
  const finish = () => { busy = false; refresh(); save(); };

  if (key === 'fireball') {
    castFireball({ x, z }, () => {
      const dice = roll(8, 6);
      for (const c of state.creatures) if (c.alive && inTiles(c)) spellHit(sp, c, 'The fireball engulfs', dice);
      if (inTiles(state.pos)) {
        const r = roll(1, 20)[0] + mod(state.char.abilities.dex), saved = r >= derived().spellDc;
        hurtHero(saved ? Math.floor(sum(dice) / 2) : sum(dice), `Caught in your own fireball${saved ? ' (Dex save, half)' : ''}`);
      }
      finish();
    });
    refresh(); return;
  }

  after(reduceMotion ? 0.25 : 0.7, () => {
    const e = { id: state.nextId++, type: key, tiles, axis, center: { x, z }, rounds: sp.duration, wraps: [] };
    if (key === 'vines') {
      for (const c of state.creatures) if (c.alive && inTiles(c)) { const saved = spellHit(sp, c, ''); if (!saved) e.wraps.push({ x: c.x, z: c.z, id: c.id }); }
    }
    state.effects.push(e);
    rebuildFxGrid();
    spawnVisual(e, false);
    if (key !== 'vines') after(0.35, () => {
      const dice = roll(sp.damage[0], sp.damage[1]);
      for (const c of state.creatures) if (c.alive && tiles.some(t => cheb(t, c) <= 1))
        spellHit(sp, c, key === 'firewall' ? 'Flames lash' : 'Erupting ice batters', dice);
      finish();
    });
    else after(0.3, finish);
    refresh(); save();
  });
  refresh();
}

/* --- inventory --- */
const invEntry = key => state.char.inventory.find(i => i.key === key);
function removeOne(key) {
  const c = state.char, it = invEntry(key); if (!it) return;
  it.qty--;
  if (it.qty <= 0) {
    c.inventory = c.inventory.filter(i => i !== it);
    for (const slot of ['weapon', 'armor', 'shield', 'head']) if (c.equipped[slot] === key) c.equipped[slot] = null;
  }
}
function equip(key) {
  const c = state.char, item = ITEMS[key], eq = c.equipped;
  if (item.type === 'weapon') {
    eq.weapon = key;
    if (item.twoHanded && eq.shield) { eq.shield = null; toast(`${item.name} needs both hands, so you sling your shield.`); }
  } else if (item.type === 'armor') eq.armor = key;
  else if (item.type === 'head') {
    eq.head = key;
    if (item.cursed && !c.curseLifted) {
      c.curseKnown = true;
      addLog('hit', `The <b>${item.name}</b> tightens around your skull. Cold water seems to fill your lungs for a heartbeat. <b>It's cursed</b>: it won't come off, and it will drain you.`);
      showModal(`The ${item.name} is cursed`, `<p>The moment it touches your brow, the black iron tightens. The stones glow violet, and you hear the sea.</p><p>${item.curseNote}</p>`, [{ label: 'Uh oh', primary: true }]);
      return;
    }
  } else if (item.type === 'shield') {
    eq.shield = key;
    if (eq.weapon && ITEMS[eq.weapon].twoHanded) { toast(`You stow the ${ITEMS[eq.weapon].name.toLowerCase()} to take up the shield.`); eq.weapon = null; }
  }
  addLog('', `Equipped <b>${item.name}</b>.`);
}
function unequip(slot) {
  const k = state.char.equipped[slot];
  if (slot === 'head' && isCursed()) return toast('The crown won\'t come off. It\'s cursed.');
  state.char.equipped[slot] = null; if (k) addLog('', `Unequipped <b>${ITEMS[k].name}</b>.`);
}
function useItem(key) {
  const item = ITEMS[key];
  if (item.type !== 'consumable') return;
  if (!exploring() && !state.turn.action) return toast('Drinking a potion takes your action, and it is already spent.');
  if (state.char.hp >= derived().maxHp) return toast('You are already at full health.');
  if (!exploring()) state.turn.action = false;
  const [n, d, b] = item.heal, dice = roll(n, d);
  heal(sum(dice) + b, `${item.name} [${dice.join(', ')}] +${b}`);
  removeOne(key);
}
function addItem(key, silent) {
  const it = invEntry(key);
  if (it) it.qty++; else state.char.inventory.push({ key, qty: 1 });
  if (!silent) addLog('', `Added <b>${ITEMS[key].name}</b> to the pack.`);
}

    </div>
    <div class="section">
      <div class="row between"><h3>Pack</h3><span class="muted">${d.weight} / ${d.cap} lb · ${c.gold} gp</span></div>
      <ul class="items">
        ${c.inventory.map(({ key, qty }) => { const it = ITEMS[key]; const locked = isEq(key) && it.cursed && isCursed(); return `
          <li class="item">
            <span class="nm">${it.name}${qty > 1 ? ` <span class="q">×${qty}</span>` : ''}${isEq(key) ? '<span class="tag">Equipped</span>' : ''}${it.weird ? '<span class="tag weird">Weird</span>' : ''}</span>
            <span class="meta">${noteOf(key, it)}${it.dice ? ` · ${it.dice[0]}d${it.dice[1]} ${it.dmgType}` : ''} · ${it.weight} lb</span>
            <span class="ctl">
              ${['weapon', 'armor', 'shield', 'head'].includes(it.type) && !isEq(key) ? `<button class="btn small" data-act="equip" data-k="${key}">Equip</button>` : ''}
              ${it.type === 'consumable' ? `<button class="btn small" data-act="use" data-k="${key}">Drink</button>` : ''}
              <button class="btn small" data-act="drop" data-k="${key}" aria-label="Drop one ${it.name}" ${locked ? 'disabled' : ''}>Drop</button>
            </span>
          </li>`; }).join('') || '<li class="muted">Your pack is empty.</li>'}
      </ul>
      <div class="row">
        <select id="addSel" aria-label="Item to add">${Object.entries(ITEMS).map(([k, it]) => `<option value="${k}">${it.name}</option>`).join('')}</select>
        <button class="btn small" data-act="add">Add item</button>
      </div>
    </div>`;
}

function renderLog() {
  $('tab-log').innerHTML = `<ul class="log">${state.log.slice().reverse().map(l => `<li class="${l.kind}">${l.html}</li>`).join('')}</ul>`;
}

function renderPanel() {
  const c = state.char;
  if (document.activeElement !== $('charName')) $('charName').value = c.name;
  $('charColor').value = c.color;
  $('charSub').textContent = `${c.species} ${c.cls} · Level ${c.level}`;
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === ui.tab);
  for (const t of ['sheet', 'spells', 'inv', 'log']) $('tab-' + t).hidden = ui.tab !== t;
  ({ sheet: renderSheet, spells: renderSpells, inv: renderInv, log: renderLog })[ui.tab]();
}

function refreshBoard() {
  rebuildFxGrid();
  computeVisibility(); applyFog();
  if (exploring()) { state.turn.move = 40; state.turn.action = true; }
  reach = dijkstra(state.pos.x, state.pos.z, heroBudget(), 'hero');
  if (ui.spell) { previewSpell(ui.aim); return; }
  const showRange = !exploring() && !anim && !busy;
  for (let i = 0; i < W * H; i++) {
    const o = overlays[i]; if (!o) continue;
    const dd = reach.dist[i];
    o.visible = showRange && dd > 0 && dd <= state.turn.move && !!vis[i];
    if (o.visible) {
      o.material.opacity = 0.3;
      o.material.color.set((fxGrid[i] & FIRE) ? '#ff7a3a' : (DIFFICULT.has(tileAt(i % W, (i / W) | 0)) || (fxGrid[i] & VINE)) ? '#a7c27a' : '#7aa7cb');
    }
  }
}
function canAttack(c) {
  const w = derived().weapon;
  return !busy && c.alive && state.turn.action && cheb(state.pos, c) <= w.range && (!w.ranged || los(state.pos.x, state.pos.z, c.x, c.z));
}

function refresh() { refreshBoard(); renderHud(); renderPanel(); }

/* --- events --- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; renderPanel();
});
$('charName').addEventListener('input', e => { state.char.name = e.target.value || 'Unnamed hero'; save(); });
$('charName').addEventListener('change', () => renderPanel());
$('charColor').addEventListener('input', e => { state.char.color = e.target.value; heroBodyMat.color.set(e.target.value); heroParts.cloth?.material.color.set(e.target.value); save(); });
$('spellbar').addEventListener('click', e => { const b = e.target.closest('[data-spell]'); if (b) selectSpell(b.dataset.spell); });
$('mapSel').innerHTML = Object.entries(MAPS).map(([k, m]) => `<option value="${k}">${m.name}</option>`).join('');
$('mapSel').addEventListener('change', e => {
  const key = e.target.value; e.target.value = state.mapKey;
  if (busy || anim) return;
  showModal(`Travel to the ${MAPS[key].name}?`, `<p>Progress on this map resets. ${state.char.name} keeps their level, gear and gold.</p>`, [
    { label: 'Travel', primary: true, fn: () => restartMap(key, state.char) }, { label: 'Stay here' }]);
});

$('panel').addEventListener('change', e => {
  if (e.target.id === 'sandbox') { ui.sandbox = e.target.checked; savePrefs(); refresh(); }
  if (e.target.id === 'quality') setQuality(e.target.value);
});
$('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const c = state.char, k = b.dataset.k, act = b.dataset.act;
  if (act !== 'reset') ui.confirmReset = false;
  switch (act) {
    case 'check': rollCheck(k); return;
    case 'die': rollDie(+b.dataset.s); return;
    case 'cast': selectSpell(k); return;
    case 'editScores': ui.editScores = !ui.editScores; break;
    case 'inc': case 'dec': {
      const before = derived().maxHp;
      c.abilities[k] = Math.min(20, Math.max(3, c.abilities[k] + (act === 'inc' ? 1 : -1)));
      const after = derived().maxHp; c.hp = Math.max(1, Math.min(after, c.hp + (after - before)));
      break;
    }
    case 'dmg': case 'heal': {
      const n = Math.max(1, parseInt($('hpAmt').value, 10) || 0);
      if (act === 'dmg') hurtHero(n, 'Damage'); else heal(n, 'Healing');
      break;
    }
    case 'rest':
      if (!exploring()) { toast('You can\'t rest with enemies hunting you.'); return; }
      c.hp = derived().maxHp; c.slots = freshSlots();
      addLog('heal', `${c.name} takes a long rest: full HP and spell slots.`); break;
    case 'equip': equip(k); dressHero(); break;
    case 'unequip': unequip(k); dressHero(); break;
    case 'use': useItem(k); break;
    case 'drop':
      if (ITEMS[k].cursed && Object.values(c.equipped).includes(k) && isCursed()) return toast('It won\'t come off.');
      addLog('', `Dropped one <b>${ITEMS[k].name}</b>.`); removeOne(k); dressHero(); break;
    case 'add': addItem($('addSel').value); break;
    case 'reset':
      if (!ui.confirmReset) { ui.confirmReset = true; break; }
      ui.confirmReset = false; restartMap(state.mapKey, null); return;
  }
  refresh(); save();
});

$('searchBtn').addEventListener('click', search);
$('dashBtn').addEventListener('click', dash);
$('endBtn').addEventListener('click', endTurn);
$('viewBtn').addEventListener('click', resetView);
window.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || !$('modal').hidden) return;
  const k = Object.keys(SPELLS).find(k => SPELLS[k].key === e.key);
  if (k) { selectSpell(k); e.preventDefault(); }
  else if (e.key === 'Escape') cancelSpell();
});

function setQuality(name) {
  qName = name; Q = QUALITY[name]; savePrefs();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, Q.pr));
  composer.setPixelRatio(Math.min(window.devicePixelRatio, Q.pr));
  bloom.enabled = Q.bloom;
  resize();
  toast(`Effects quality: ${Q.label}. New ice walls use the new setting.`);
}

/* --- board picking --- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const shown = o => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [hero];
  for (const v of views.values()) if (v.g.visible) targets.push(v.g);
  for (const m of tileMeshes) if (m && m.visible) targets.push(m);
  for (const p of props) if (p.o.visible) targets.push(p.o);
  const hit = raycaster.intersectObjects(targets, true).find(h => h.object.userData.kind && h.object.userData.kind !== 'deco' && shown(h.object));
  if (!hit) return null;
  const u = hit.object.userData;
  if (u.kind === 'creature') { const c = creatureById(u.cid); if (!c || !c.alive) { const p = c ? { kind: 'tile', x: c.x, z: c.z } : null; return p; } }
  return u;
}
const tileOf = p => !p ? null : p.kind === 'creature' ? (c => ({ x: c.x, z: c.z }))(creatureById(p.cid)) : p.kind === 'hero' ? { ...state.pos } : { x: p.x, z: p.z };
const hoverBox = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints([[-.46, -.46], [.46, -.46], [.46, .46], [-.46, .46]].map(([a, b]) => new THREE.Vector3(a, 0, b))),
  new THREE.LineBasicMaterial({ color: '#d3aa55', toneMapped: false }));
hoverBox.visible = false; scene.add(hoverBox);
const dotGeo = new THREE.SphereGeometry(0.06, 10, 8);
const dotMat = new THREE.MeshBasicMaterial({ color: '#d3aa55', toneMapped: false });
const pathDots = Array.from({ length: 60 }, () => { const d = new THREE.Mesh(dotGeo, dotMat); d.visible = false; scene.add(d); return d; });
function clearPath() { pathDots.forEach(d => d.visible = false); hoverBox.visible = false; }
function showPath(x, z) {
  clearPath();
  const p = worldOf(x, z); hoverBox.position.set(p.x, p.y + 0.01, p.z); hoverBox.visible = true;
  pathFrom(reach, x, z).slice(1).forEach((c, i) => { if (pathDots[i]) { pathDots[i].position.copy(worldOf(c.x, c.z)).add(new THREE.Vector3(0, 0.08, 0)); pathDots[i].visible = true; } });
}
const reachable = (x, z) => { const d = reach && reach.dist[z * W + x]; return d > 0 && d <= heroBudget(); };

let down = null;
canvas.addEventListener('contextmenu', e => { if (ui.spell) { e.preventDefault(); cancelSpell(); } });
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, b: e.button }; });
canvas.addEventListener('pointermove', e => {
  if (anim || busy || e.pointerType === 'touch' || state.over) return;
  const p = pick(e);
  const hov = p && p.kind === 'creature' ? p.cid : null;
  if (hov !== ui.hover) { ui.hover = hov; renderHud(); }
  if (ui.spell) { previewSpell(tileOf(p)); canvas.style.cursor = 'crosshair'; return; }
  canvas.style.cursor = 'grab'; clearPath();
  if (!p) return;
  if (p.kind === 'creature') { canvas.style.cursor = canAttack(creatureById(p.cid)) ? 'crosshair' : 'pointer'; return; }
  const ch = tileAt(p.x, p.z), tr = state.traps[keyOf(p.x, p.z)];
  if (p.kind === 'prop' && !WALKABLE.has(ch) || (tr && tr.found)) { canvas.style.cursor = 'pointer'; return; }
  if ((p.kind === 'tile' || p.kind === 'prop') && reachable(p.x, p.z)) { showPath(p.x, p.z); canvas.style.cursor = 'pointer'; }
});
canvas.addEventListener('pointerup', e => {
  if (!down || down.b !== 0 || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || anim || busy || state.over) { down = null; return; }
  down = null;
  const p = pick(e);
  if (ui.spell) {
    const t = tileOf(p); if (!t) return;
    if (e.pointerType === 'touch' && (!ui.aim || ui.aim.x !== t.x || ui.aim.z !== t.z)) return previewSpell(t);
    return cast(ui.spell, t.x, t.z);
  }
  if (!p) return;
  if (p.kind === 'creature') return attack(creatureById(p.cid));
  if (p.kind === 'hero') { ui.tab = 'sheet'; return renderPanel(); }
  const ch = tileAt(p.x, p.z), tr = state.traps[keyOf(p.x, p.z)];
  if ((p.kind === 'prop' || !WALKABLE.has(ch)) && !isWall(ch) && !WALKABLE.has(ch) || (tr && tr.found)) return interact(p.x, p.z);
  if (isWall(ch)) return toast('Solid stone. Try searching nearby walls for secrets.');
  if (reachable(p.x, p.z)) moveTo(p.x, p.z);
  else if (solidAt(p.x, p.z)) toast('The wall of ice blocks your way.');
  else if (!(p.x === state.pos.x && p.z === state.pos.z)) toast(exploring() ? 'You can\'t get there from here.' : state.turn.move ? `Out of reach. You have ${state.turn.move * 5} ft of movement left.` : 'No movement left. Dash or end your turn.');
});

/* ================================================================== *
 * LOOP
 * ================================================================== */
function resetView() {
  const t = MAP.fog ? worldOf(state.pos.x, state.pos.z).setY(0) : new THREE.Vector3();
  controls.target.copy(t);
  camera.position.copy(t).add(MAP.fog ? new THREE.Vector3(0, 10.5, 8.5) : new THREE.Vector3(0, 13, 12));
  controls.update();
}
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  composer.setSize(r.width, r.height);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
  pScale.value = r.height * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
new ResizeObserver(resize).observe(stage);

function bootBoard() {
  buildBoard(); rebuildCreatures(); dressHero(); placeHero();
  rebuildFxGrid();
  for (const e of state.effects) spawnVisual(e, true);
  computeVisibility(); applyFog(); resetView();
}

const clock = new THREE.Clock(), tmp = new THREE.Vector3(), shakeOff = new THREE.Vector3(), follow = new THREE.Vector3();
const RED = new THREE.Color('#ff2a10');
let moteT = 0, torchT = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  fxTime.value = time;

  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  for (let i = fxList.length - 1; i >= 0; i--) if (fxList[i].update(dt) === false) fxList.splice(i, 1);
  for (const p of props) p.update(dt, time);

  // the six torch lights sit on whichever explored torches are closest to the hero
  if ((torchT -= dt) <= 0) {
    torchT = 0.3;
    const near = torchSpots.filter(t => state.explored[t.i]).sort((a, b) => a.pos.distanceToSquared(hero.position) - b.pos.distanceToSquared(hero.position));
    torchLights.forEach((l, k) => { l.userData.spot = near[k] || null; if (near[k]) l.position.copy(near[k].pos); });
  }
  for (const l of torchLights) { const t = l.userData.spot; l.intensity = t ? 9 + Math.sin(time * 9 + t.n) * 1.5 + Math.sin(time * 23 + t.n * 3) : 0; }
  if (MAP.dark) stream(smoke, 0.1, dt, () => { const c = hero.position; return { p: [c.x + rnd(-7, 7), rnd(.25, .45), c.z + rnd(-6, 6)], v: [rnd(-.08, .08), rnd(0, .02), rnd(-.08, .08)],
    life: rnd(6, 9), s: [1.4, 2.6], c0: hdr('#39404c'), c1: hdr('#2a2f38'), a: .1, fi: .4 }; });

  moteT += dt;
  if (moteT > 0.12) { moteT = 0; const c = hero.position; glow.emit({ p: [c.x + rnd(-7, 7), rnd(.4, 3), c.z + rnd(-5, 5)], v: [rnd(-.05, .05), rnd(-.02, .05), rnd(-.05, .05)],
    life: rnd(4, 7), s: [.025, .025], c0: hdr('#ffd9a0', .7), a: .8, turb: .15, fi: .3 }); }

  // hero
  if (anim) {
    anim.t += dt / (reduceMotion ? 0.06 : 0.18);
    while (anim && anim.t >= 1) {
      anim.t -= 1; anim.i++;
      const cell = anim.path[anim.i];
      state.pos = { ...cell };
      const stop = onHeroStep(cell);
      if (stop || anim.i >= anim.path.length - 1) finishMove(stop);
    }
    if (anim) {
      const a = worldOf(anim.path[anim.i].x, anim.path[anim.i].z), b = worldOf(anim.path[anim.i + 1].x, anim.path[anim.i + 1].z);
      hero.position.lerpVectors(a, b, anim.t);
      hero.position.y += Math.sin(Math.PI * anim.t) * 0.15;
      hero.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
    }
  } else {
    if (faceAt) {
      const face = Math.atan2(faceAt.x - hero.position.x, faceAt.z - hero.position.z);
      let diff = face - hero.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      hero.rotation.y += diff * Math.min(1, dt * 8);
    }
    const base = worldOf(state.pos.x, state.pos.z);
    hero.position.copy(base);
    if (lunge > 0) { lunge = Math.max(0, lunge - dt * 4); hero.position.addScaledVector(lungeDir, Math.sin(Math.PI * lunge) * 0.2); }
  }
  heroFlash = Math.max(0, heroFlash - dt * 3);
  for (const m of heroFlashMats) m.emissive.copy(RED).multiplyScalar(heroFlash * 0.8);
  heroRing.material.opacity = 0.55 + Math.sin(time * 3) * 0.3;
  heroLight.position.copy(hero.position).add(tmp.set(0, 1.6, 0));

  // creatures
  const r = stage.getBoundingClientRect();
  for (const c of state.creatures) {
    const v = views.get(c.id); if (!v) continue;
    if (v.anim) {
      const a = v.anim; a.t += dt / (reduceMotion ? 0.06 : 0.16);
      while (v.anim && a.t >= 1) {
        a.t -= 1; a.i++;
        const cell = a.path[a.i]; c.x = cell.x; c.z = cell.z;
        if (fxGrid[cell.z * W + cell.x] & FIRE) damageCreature(c, sum(roll(2, 6)), 'dmg');
        if (a.i >= a.path.length - 1 || !c.alive) { v.anim = null; applyFog(); a.res(); }
      }
      if (v.anim) {
        const p0 = worldOf(a.path[a.i].x, a.path[a.i].z), p1 = worldOf(a.path[a.i + 1].x, a.path[a.i + 1].z);
        v.g.position.lerpVectors(p0, p1, a.t); v.g.position.y += Math.sin(Math.PI * a.t) * 0.1;
        v.g.rotation.y = Math.atan2(p1.x - p0.x, p1.z - p0.z);
        const lit = !!vis[a.path[a.i + 1].z * W + a.path[a.i + 1].x] || !!vis[a.path[a.i].z * W + a.path[a.i].x];
        v.g.visible = lit;
      }
    } else {
      v.g.position.copy(worldOf(c.x, c.z));
      if (v.lunge > 0) { v.lunge = Math.max(0, v.lunge - dt * 4); v.g.position.addScaledVector(v.lungeDir, Math.sin(Math.PI * v.lunge) * 0.22); }
      if (c.alive && (c.aware || c.type === 'dummy')) {
        const face = Math.atan2(hero.position.x - v.g.position.x, hero.position.z - v.g.position.z);
        let diff = face - v.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        v.g.rotation.y += diff * Math.min(1, dt * 6);
      }
    }
    v.pivot.rotation.z = Math.sin(time * 40) * v.shake * 0.12; v.shake = Math.max(0, v.shake - dt * 2.5);
    v.pivot.rotation.x += ((c.alive ? 0 : -1.35) - v.pivot.rotation.x) * Math.min(1, dt * 6);
    if (v.flash > 0) { v.flash = Math.max(0, v.flash - dt * 3); for (const m of v.mats) m.emissive.copy(RED).multiplyScalar(v.flash); }
    const attackable = c.alive && canAttack(c);
    v.ring.visible = c.alive && v.g.visible && (c.aware || c.type === 'dummy' || ui.hover === c.id);
    v.ring.material.opacity = attackable ? 0.6 + Math.sin(time * 5) * 0.35 : 0.35;
    const showBar = c.alive && v.g.visible && (c.aware || c.hp < MONSTERS[c.type].hp || ui.hover === c.id);
    v.bar.hidden = !showBar;
    if (showBar) {
      tmp.copy(v.g.position); tmp.y += v.height * v.g.scale.y + 0.35; tmp.project(camera);
      v.bar.style.left = ((tmp.x + 1) / 2) * r.width + 'px'; v.bar.style.top = ((1 - tmp.y) / 2) * r.height + 'px';
      v.bar.firstChild.style.width = (c.hp / MONSTERS[c.type].hp * 100) + '%';
    }
  }

  glow.update(dt, time); smoke.update(dt, time);

  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt;
    tmp.copy(f.pos).add(new THREE.Vector3(0, f.t * 0.6, 0)).project(camera);
    f.el.style.left = ((tmp.x + 1) / 2) * r.width + 'px';
    f.el.style.top = ((1 - tmp.y) / 2) * r.height + 'px';
    f.el.style.opacity = Math.max(0, 1 - Math.max(0, f.t - 0.9) / 0.6);
    if (f.t > 1.5) { f.el.remove(); floats.splice(i, 1); }
  }

  // the camera drifts after the hero on big maps
  if (MAP.fog) {
    follow.copy(hero.position).setY(0).sub(controls.target); follow.y = 0;
    const d = follow.length();
    if (d > 1.5) { follow.multiplyScalar((1 - 1.5 / d) * Math.min(1, dt * 3)); controls.target.add(follow); camera.position.add(follow); }
  }

  controls.update();
  shake = Math.max(0, shake - dt * 1.6);
  shakeOff.set((Math.random() - .5), (Math.random() - .5), (Math.random() - .5)).multiplyScalar(shake * shake * 0.6);
  camera.position.add(shakeOff);
  composer.render();
  camera.position.sub(shakeOff);
  requestAnimationFrame(tick);
}

// handy for debugging from the browser console
window.battleBoard = {
  camera, controls, get state() { return state; },
  screenOf(x, z) { const r = canvas.getBoundingClientRect(), p = worldOf(x, z).project(camera); return { x: r.left + (p.x + 1) / 2 * r.width, y: r.top + (1 - p.y) / 2 * r.height }; },
  teleport(x, z) { state.pos = { x, z }; placeHero(); resetView(); refresh(); },
};
bootBoard();
refresh();
resize();
tick();
</script>
