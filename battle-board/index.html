<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: full-bleed 3D tabletop on the left, a character sheet docked right (a bottom sheet on phones). */
  :root {
    --table: #16120e;      /* walnut table */
    --panel: #201a14;      /* sheet background */
    --panel-2: #2a221a;    /* raised fields */
    --line: #3e3429;
    --ink: #ece2cf;        /* parchment text */
    --muted: #a6978a;
    --brass: #d3aa55;      /* accent */
    --blood: #d0604b;      /* damage / critical */
    --moss: #86ad6b;       /* healing / good */
    --sky: #7aa7cb;        /* movement */
    --display: "Alegreya SC", Georgia, "Times New Roman", serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--table); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }

  /* HUD over the board */
  .hud { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px;
         display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
          background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
          border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip b { font-weight: 700; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
  .chip .dot.spent { background: transparent; border: 1px solid var(--muted); }
  .chip.map { font-family: var(--display); letter-spacing: .04em; }
  .chip.move b { color: var(--sky); }

  .actions { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 14px;
             display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .actions .row { pointer-events: none; }
  .actions .row > * { pointer-events: auto; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; line-height: 1.2; }
  .btn:hover:not(:disabled) { border-color: var(--brass); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--brass); color: #20180d; border-color: var(--brass); font-weight: 700; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none !important; }

  .spell { --c: var(--brass); display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px 6px 7px;
           background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; }
  .spell .k { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; font-size: 12px;
              background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); font-weight: 700; }
  .spell .lv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spell:hover:not(:disabled) { border-color: var(--c); }
  .spell[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .spell:disabled { opacity: .45; cursor: not-allowed; }

  .toast, .aim { position: absolute; left: 50%; transform: translateX(-50%); max-width: min(460px, calc(100% - 32px));
           background: var(--panel); border: 1px solid var(--brass); border-radius: 8px; padding: 8px 12px;
           font-size: 14px; text-align: center; pointer-events: none; }
  .toast { top: auto; bottom: 150px; left: 12px; transform: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
           background: none; border: 0; padding: 0; max-width: min(320px, calc(100% - 32px)); z-index: 4; zoom: var(--ui, 1); }
  .tmsg { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brass); border-radius: 8px; padding: 7px 11px; text-align: left;
          box-shadow: 0 6px 20px rgba(0,0,0,.45); animation: tmsgIn .2s ease-out; transition: opacity .35s; }
  .tmsg.off { opacity: 0; }
  @keyframes tmsgIn { from { opacity: 0; transform: translateX(-12px); } }
  .aim { top: auto; bottom: 122px; border-color: var(--c, var(--brass)); zoom: var(--ui, 1); }
  .chip.odds { border-color: #d3aa55; color: #ffe3a0; }
  .tag.rar { color: var(--rc); border-color: var(--rc); }
  .fnote { margin: 2px 0 0; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .lootlist .btn { white-space: nowrap; }
  .sneaky { color: #9fd0a0; font-weight: 700; margin-right: 6px; }
  .sti.w { width: auto; padding: 0 5px; font-style: normal; font-size: 11px; gap: 3px; }
  .sbtn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  .keys { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .keys .btn { min-width: 64px; }
  #playBar, #sideBtns, #partyFrames, #initBar, #bossBar, #hud, .narr, .notice, #panel, #edPanel { zoom: var(--ui, 1); }
  @media (max-width: 760px) { .toast { bottom: 170px; } }
  .vignette, .blood, .hitflash { position: absolute; inset: 0; pointer-events: none; }
  .vignette { background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 40%, rgba(4,2,1,.72) 100%); }
  .blood { background: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 45%, rgba(150,8,0,.6) 100%); opacity: 0; transition: opacity .6s; }
  .blood.low { opacity: .45; animation: bloodPulse 1s ease-in-out infinite; }
  .blood.dying { opacity: .8; animation: bloodPulse .7s ease-in-out infinite; }
  @keyframes bloodPulse { 50% { opacity: .95; } }
  .hitflash { background: radial-gradient(ellipse at center, rgba(200,20,0,.12), rgba(200,20,0,.45)); opacity: 0; }
  .hitflash.go { animation: hitFlash .5s ease-out; }
  .curtain { position: absolute; inset: 0; pointer-events: none; background: #050403; display: grid; place-items: center; text-align: center; opacity: 1; transition: opacity 1.6s ease-in; z-index: 3; }
  .curtain.up { opacity: 0; }
  .curtain small { color: var(--brass); letter-spacing: .28em; text-transform: uppercase; font-size: 12px; }
  .curtain h2 { font-family: var(--display, Georgia, serif); font-size: clamp(26px, 5vw, 46px); margin: 10px 0 8px; color: #efe6d2; font-weight: 600; }
  .curtain p { color: #a89c86; font-style: italic; max-width: 34em; margin: 0 auto; padding: 0 20px; }
  @keyframes hitFlash { from { opacity: 1; } to { opacity: 0; } }
  .narr { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); width: min(540px, calc(100% - 32px)); box-sizing: border-box;
          background: rgba(18,13,9,.93); border: 1px solid var(--brass); border-radius: 10px; padding: 14px 18px 12px; cursor: pointer;
          box-shadow: 0 10px 40px rgba(0,0,0,.6); transition: opacity .8s; z-index: 3; }
  .narr.fade { opacity: 0; }
  @media (max-width: 900px) { .narr { padding: 8px 12px; bottom: 118px; } .narr h3 { font-size: 15px; } .narr p { font-size: 13px; line-height: 1.4; } }
  .narr h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 500; letter-spacing: .05em; color: var(--brass); font-size: 18px; }
  .narr p { margin: 0; font-style: italic; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .blood.low, .blood.dying { animation: none; } }

  #fx { position: absolute; inset: 0; pointer-events: none; }
  .float { position: absolute; transform: translate(-50%, -100%); font: 700 22px/1 var(--display);
           text-shadow: 0 2px 4px #000, 0 0 2px #000; white-space: nowrap; }
  .float.dmg { color: var(--blood); } .float.crit { color: #ffcf6b; font-size: 28px; }
  .float.heal { color: var(--moss); } .float.miss { color: var(--muted); font-size: 18px; }
  .float.xp { color: var(--brass); font-size: 18px; } .float.cold { color: #9fdcff; } .float.vine { color: #a6e07a; font-size: 18px; }

  /* Character sheet */
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0;
           padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
           display: flex; flex-direction: column; gap: 14px; }
  .sheet-head { display: flex; gap: 12px; align-items: center; }
  .swatch { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 2px solid var(--brass); padding: 0; overflow: hidden; background: none; }
  .swatch input { width: 60px; height: 60px; margin: -10px; border: 0; padding: 0; cursor: pointer; background: none; }
  .name-input { width: 100%; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent;
                font: 700 22px/1.15 var(--display); letter-spacing: .02em; padding: 0; }
  .name-input:hover, .name-input:focus { border-bottom-color: var(--line); outline: none; }
  .sub { color: var(--muted); font-size: 14px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; color: var(--muted);
                 font-family: var(--display); letter-spacing: .05em; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }

  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  h3 { margin: 0; font: 700 13px/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--brass); }
  .section { display: flex; flex-direction: column; gap: 10px; }
  [id^="tab-"]:not([hidden]) { display: flex; flex-direction: column; gap: 18px; }

  .vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vital { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px; text-align: center; }
  .vital .v { font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .hp { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hp-top { display: flex; justify-content: space-between; align-items: baseline; }
  .hp-top .v { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #120e0b; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--moss); transition: width .3s; }
  .bar.xp > i { background: var(--brass); }
  .hp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hp-row input { width: 64px; background: #120e0b; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

  .abilities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ab { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px 6px; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 2px; }
  button.ab:hover { border-color: var(--brass); }
  .ab .m { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .ab .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .ab .step { display: flex; gap: 4px; margin-top: 4px; }
  .ab .step button { width: 26px; height: 22px; padding: 0; border-radius: 5px; background: #120e0b; border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }

  .attack { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid;
            grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .attack .n { font-weight: 700; }
  .dice { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dice button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; font-family: var(--display); }
  .dice button:hover { border-color: var(--brass); }

  .slots { display: flex; flex-direction: column; gap: 6px; }
  .slot { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; background: var(--panel-2);
          border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .slot .empty { color: var(--muted); font-style: italic; }
  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item .nm { font-weight: 500; min-width: 0; }
  .item .nm .q { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .meta { grid-column: 1; color: var(--muted); font-size: 13px; }
  .item .ctl { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-items: center; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); border: 1px solid var(--brass);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  select { background: #120e0b; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; flex: 1; }

  .castline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pips { display: flex; flex-direction: column; gap: 6px; }
  .pip-row { display: flex; align-items: center; gap: 10px; }
  .pip-row .label { width: 56px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--brass); }
  .pip.on { background: var(--brass); box-shadow: 0 0 8px color-mix(in srgb, var(--brass) 60%, transparent); }
  .spellcard { --c: var(--brass); background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c);
               border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .spellcard .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .spellcard .t b { font: 700 17px/1.1 var(--display); }
  .spellcard p { margin: 0; font-size: 14px; color: var(--muted); }
  .spellcard .facts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toggle { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .toggle input { margin-top: 3px; accent-color: var(--brass); }

  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .log li { background: var(--panel-2); border-left: 3px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .log li.hit { border-left-color: var(--blood); } .log li.crit { border-left-color: #ffcf6b; }
  .log li.heal { border-left-color: var(--moss); } .log li.sys { border-left-color: var(--brass); }
  .log li.spell { border-left-color: #c27bff; }
  .lootlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lootlist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .lootlist li > span { min-width: 0; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--sw); padding: 0; }
  .sw.on { border-color: var(--brass); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 40%, transparent); }
  .btn.on { border-color: var(--brass); color: var(--brass); }
  .log .r { font-variant-numeric: tabular-nums; color: var(--muted); }
  .log b { color: var(--ink); }
  .muted { color: var(--muted); font-size: 13px; }


  .hud-chips { display: contents; }
  select.chip { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .chip.combat { border-color: var(--blood); color: #ffb3a6; }
  .chip.combat .dot { background: var(--blood); }
  .chip.explore { border-color: color-mix(in srgb, var(--sky) 60%, var(--line)); }
  .chip.target { border-color: var(--blood); }
  .hpbar { position: absolute; width: 46px; height: 6px; transform: translate(-50%, -100%); background: #120e0b;
           border: 1px solid #000; border-radius: 3px; overflow: hidden; }
  .hpbar > i { display: block; height: 100%; background: var(--blood); }
  .hpbar.boss { width: 74px; height: 8px; }
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 6, 4, .62); z-index: 20; padding: 16px; }
  .modal .card { background: var(--panel); border: 1px solid var(--brass); border-radius: 12px; padding: 20px; max-width: 440px;
                 width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal h2 { margin: 0; font: 700 26px/1.1 var(--display); color: var(--brass); text-wrap: balance; }
  .modal p { margin: 0; line-height: 1.5; }
  .modal .inscription { font: italic 17px/1.55 var(--display); color: var(--ink); border-left: 3px solid var(--brass); padding-left: 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
  .stats div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; }
  .tag.curse { color: #c98bff; border-color: #c98bff; }
  .tag.weird { color: #7fd8ff; border-color: #7fd8ff; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .panel { max-height: 45vh; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .hint { display: none; }
    .spell { padding: 5px 8px 5px 5px; font-size: 13px; }
    .spell .lv { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > i, .toast { transition: none; } }

  /* Modes: menu (board orbits behind the screens), play, edit */
  body[data-mode="menu"] .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  body[data-mode="menu"] .panel, body[data-mode="menu"] .hud, body[data-mode="menu"] .actions, body[data-mode="menu"] .narr { display: none !important; }
  body[data-mode="edit"] #panel, body[data-mode="edit"] #playBar, body[data-mode="edit"] #hudChips, body[data-mode="edit"] .narr,
  body[data-mode="edit"] .vignette, body[data-mode="edit"] .blood { display: none !important; }
  body:not([data-mode="edit"]) #edPanel, body:not([data-mode="edit"]) #edBar { display: none !important; }
  .chip.menu { cursor: pointer; font-family: var(--display); letter-spacing: .04em; }
  .chip.menu:hover { border-color: var(--brass); }

  .screen { position: fixed; inset: 0; z-index: 30; overflow-y: auto; padding: 40px 16px;
            background: radial-gradient(ellipse 90% 70% at 50% 35%, rgba(18, 13, 9, .45), rgba(10, 8, 6, .93) 80%); }
  .menu { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .menu.title { min-height: calc(100% - 20px); justify-content: center; align-items: center; text-align: center; }
  .menu h1 { margin: 0; font: 700 clamp(44px, 9vw, 84px)/1 var(--display); color: var(--brass); letter-spacing: .04em; text-shadow: 0 6px 40px #000; }
  .menu .sub { margin: -6px 0 0; color: var(--muted); }
  .menu .sub.small { font-size: 13px; margin: 0; }
  .menu h3 { margin-top: 6px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; width: 100%; max-width: 640px; }
  .choice { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 20px; color: var(--muted);
            background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 12px; }
  .choice:hover { border-color: var(--brass); transform: translateY(-1px); }
  .choice .ct { font: 700 28px/1.1 var(--display); color: var(--ink); }
  .btn.big { padding: 11px 18px; font-size: 16px; }
  .btn.danger { border-color: var(--blood); color: #ffb3a6; }
  .mhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mhead h2 { margin: 0; font: 700 30px/1.1 var(--display); color: var(--brass); text-wrap: balance; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card2 { background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
           display: flex; flex-direction: column; gap: 8px; text-align: left; }

<body>
<div class="screen" id="screen" hidden></div>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D battle board"></canvas>
    <div class="vignette" id="vignette"></div>
    <div class="blood" id="blood"></div>
    <div class="curtain" id="curtain" hidden><div><small id="curS"></small><h2 id="curT"></h2><p id="curP"></p></div></div>

    <div id="fx"></div>
    <div class="narr" id="narr" hidden><h3 id="narrT"></h3><p id="narrP"></p></div>

    <div class="toast off" id="toast" role="status" aria-live="polite"></div>

    <div class="actions" id="edBar">
      <div class="row"><span class="tool" id="edTool"></span></div>
      <div class="row">
        <button class="btn" id="edUndo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn" id="edRedo" title="Redo (Ctrl+Y)">Redo</button>
        <button class="btn" id="edTop">Top view</button>
        <button class="btn" id="edLight">Preview lighting</button>
        <button class="btn primary" id="edPlay">Playtest</button>
        <span class="hint">Left-drag paints · Right-drag turns · WASD or Shift+right-drag pans · Scroll zooms</span>
      </div>
    </div>
    <div class="partyframes" id="partyFrames" hidden></div>
    <div class="notice" id="notice" hidden role="status" aria-live="polite"></div>
    <div class="bossbar" id="bossBar" hidden></div>
    <div class="initbar" id="initBar" hidden title="Initiative order"></div>
    <div class="vs" id="vs" hidden><div class="vs-slash"></div><div class="vs-l" id="vsL"></div><div class="vs-mid">VS</div><div class="vs-r" id="vsR"></div></div>

      <button class="sbtn" data-panel="sheet" title="Character sheet (C)"><b>C</b>Character</button>
      <button class="sbtn" data-panel="inv" title="Inventory (I)"><b>I</b>Inventory</button>
      <button class="sbtn" data-panel="spells" title="Spellbook (K)"><b>K</b>Spells</button>
      <button class="sbtn" data-panel="log" title="Adventure log (L)"><b>L</b>Log</button>
      <button class="sbtn" id="modeBtn" title="Party: take turns in order, or command everyone freely (P)"><b>P</b><span id="modeLbl">Party</span></button>
      <button class="sbtn" id="camBtn" title="Camera: follow the action, or free (V)"><b>V</b><span id="camLbl">Follow cam</span></button>
      <button class="sbtn" id="viewBtn" title="Snap the camera back behind your hero (R)"><b>R</b>Recenter</button>
      <button class="sbtn" id="sneakBtn" title="Sneak: monsters only notice you within 20 ft, and fewer wanderers find you. Strike first for an ambush (G)"><b>G</b><span id="sneakLbl">Sneak</span></button>
      <button class="sbtn" id="tacBtn" title="Tactical view: lift the camera overhead (hold Shift, or click to toggle)"><b>⇧</b>Tactical</button>
      <button class="sbtn" id="fpBtn" title="First person: see the dungeon through your hero's eyes. W and S step, A and D turn, drag to look (B)"><b>B</b>First person</button>
      <button class="sbtn" id="soundBtn" title="Turn sound on or off">Sound</button>
      <button class="sbtn" id="setBtn" title="Settings: combat speed, text size, volume and keys"><b>⚙</b>Settings</button>
    </div>
    <div class="hotbar-wrap" id="playBar">
      <button class="vitals-card" id="vitals" title="Open the character sheet"></button>
      <div class="hotbar" id="spellbar" role="toolbar" aria-label="Hotbar"></div>
      <div class="turnbox"><span class="turninfo" id="turnInfo"></span><button class="btn primary" id="endBtn" title="End your turn (Space)">End turn</button></div>
    </div>
  </main>

  <aside class="panel" id="edPanel" aria-label="Dungeon creator"></aside>
  <aside class="panel" id="panel" aria-label="Character sheet">
    <button class="drawer-x" id="panelClose" aria-label="Close panel" title="Close (Esc)">×</button>
    <div class="sheet-head">

        <div class="sub" id="charSub"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist">

      <button role="tab" data-tab="inv" aria-selected="false">Inventory</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
    </nav>
    <div id="tab-sheet"></div>
    <div id="tab-spells" hidden></div>
    <div id="tab-inv" hidden></div>
    <div id="tab-log" hidden></div>
  </aside>
</div>

}

// Poses are shoulder (x, z) and elbow x rotations; walking, swings and casting are layered on top each frame
function animateHuman(dt, t) {
  const H = human; if (!H || !H.root.visible) return;
  const moving = !!anim;
  if (moving) walkPhase += dt * 11;
  const sw = moving ? Math.sin(walkPhase) : 0, k = Math.min(1, dt * 12);
  const L = (o, prop, v) => { o.rotation[prop] += (v - o.rotation[prop]) * k; };
  let r = { sx: -0.25, sz: -0.06, ex: -1.25 }, l = H.shield ? { sx: -0.3, sz: 0.18, ex: -1.15 } : { sx: 0.05 + sw * 0.35, sz: 0.12, ex: -0.25 };
  let mountX = 1.0, bowX = 0;
  if (H.two) { r = { sx: -0.55, sz: 0.38, ex: -0.95 }; l = { sx: -0.55, sz: -0.38, ex: -0.95 }; mountX = 1.35; }
  if (H.bow) { r = { sx: -1.25, sz: 0.45, ex: -1.7 }; l = { sx: -1.45, sz: 0.05, ex: 0 }; bowX = 1.45; }
  if (castT > 0) { r = { sx: -2.5, sz: -0.4, ex: -0.3 }; l = { sx: -2.5, sz: 0.4, ex: -0.3 }; }
  if (lunge > 0) {
    const s = Math.sin(Math.PI * lunge);
    if (H.bow) r.ex += s * 0.9;
    else { r.sx -= s * 1.6; r.ex += s * 0.6; if (H.two) { l.sx -= s * 1.6; l.ex += s * 0.6; } }
  }
  L(H.shR, 'x', r.sx); L(H.shR, 'z', r.sz); L(H.elR, 'x', r.ex);
  L(H.shL, 'x', l.sx); L(H.shL, 'z', l.sz); L(H.elL, 'x', l.ex);
  if (H.mount) H.mount.rotation.x = mountX;
  if (H.bowMount) H.bowMount.rotation.x = bowX;
  if (H.shieldMount) H.shieldMount.rotation.x = 1.15;
  H.legL.rotation.x = sw * 0.55; H.legR.rotation.x = -sw * 0.55;
  H.kneeL.rotation.x = moving ? Math.max(0, Math.sin(walkPhase + 1.2)) * 0.7 : 0;
  H.kneeR.rotation.x = moving ? Math.max(0, -Math.sin(walkPhase + 1.2)) * 0.7 : 0;
  H.torso.scale.y = 1 + Math.sin(t * 2.1) * 0.012;
  H.torso.rotation.x = -heroFlash * 0.3 + (lunge > 0 ? Math.sin(Math.PI * lunge) * 0.15 : 0);
  H.head.rotation.y = Math.sin(t * 0.6) * 0.15;
  if (H.cloak) H.cloak.rotation.x = 0.1 + (moving ? 0.35 : 0) + Math.sin(t * 1.6) * 0.04;
  if (H.eel) H.eel.forEach((sg, n) => { sg.position.x = Math.sin(t * 9 - n * 0.7) * 0.008 * n; sg.position.z = Math.cos(t * 7 - n * 0.6) * 0.004 * n; });
}

function flameMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: fxTime, uSeed: { value: Math.random() * 50 }, uHeight: { value: 0 }, uIntensity: { value: 0.55 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: NOISE + `
      uniform float uTime, uSeed, uHeight, uIntensity; varying vec2 vUv;

    vertexShader: NOISE + `

  for (let i = 0; i <= seg; i++) {

/* --- search --- */
function search() {

  if (!exploring()) { if (!state.turn.action) return toast('Searching uses your action, and it is already spent.'); state.turn.action = false; }

  const near = (x, z) => cheb(state.pos, { x, z }) <= 3 && state.explored[z * W + x];
  const sparkle = (x, z) => { const p = worldOf(x, z); burst(glow, 40, () => ({ p: [p.x + rnd(-.45, .45), rnd(.25, 1.1), p.z + rnd(-.45, .45)], v: [0, rnd(.2, .6), 0], life: rnd(.6, 1.2),
    s: [.0, .1], c0: hdr('#fff3c0', 7), c1: hdr('#d3aa55', 2), a: 1, fi: .5 })); };

  }

  ring.rotation.x = -Math.PI / 2; ring.position.copy(worldOf(state.pos.x, state.pos.z)).add(new THREE.Vector3(0, 0.03, 0)); scene.add(ring);
  let t = 0; fxList.push({ update(dt) { t += dt; ring.scale.setScalar(0.3 + easeOut(clamp01(t / 0.9)) * 3.5); ring.material.opacity = 1 - clamp01(t / 0.9); if (t > 0.9) { killMesh(ring); return false; } return true; } });

  else { addLog('', `<b>Search:</b> you find nothing unusual nearby. ${rollTxt}`); toast('You find nothing unusual within 15 ft.'); }

}

/* --- spells --- */

  const why = spellTargetError(sp, x, z); if (why) return toast(why);
  if (!freeCast()) {
    if (!state.turn.action) return toast('Casting a spell uses your action, and it is already spent.');
    if ((state.char.mp ?? 0) < costOf(sp)) return toast(`${sp.name} costs ${costOf(sp)} mana. You have ${state.char.mp}.`);
    state.char.mp -= costOf(sp); state.turn.action = false;
  }
  ui.spell = null; ui.aim = null; $('aim').hidden = true; clearPath();

  SFX.cast(NEW_SPELLS[key] ? (sp.target === 'enemy' ? 'fireball' : 'vines') : key); makeNoise(key === 'fireball' ? 3 : 1);
  castCircle(worldOf(state.pos.x, state.pos.z), sp.color, key === 'fireball' ? (reduceMotion ? 0.3 : 1.0) : 0.7);
  addLog('spell', `<b>${state.char.name}</b> casts <b>${sp.name}</b>${freeCast() ? '' : ` (${costOf(sp)} MP)`}.`);
  const inTiles = p => tiles.some(t => t.x === p.x && t.z === p.z);
  const finish = () => { busy = false; refresh(); save(); };
  if (NEW_SPELLS[key]) { castMagic(key, x, z, tiles, finish); refresh(); return; }

  if (key === 'fireball') {
    castFireball({ x, z }, () => {
      const dice = roll(8, 6);

      const dc = derived().spellDc, caster = state.char.name;
      state.party.forEach((m, i) => {
        if (!inTiles(m.pos) || m.char.hp <= 0) return;
        const saved = roll(1, 20)[0] + mod(m.char.abilities.dex) >= dc;
        hurtMember(i, evade(m.char, saved, sum(dice)), `${i === state.active ? 'Caught in your own fireball' : `Caught in ${caster}'s fireball`}${saved ? ' (Dex save, half)' : ''}`);
      });
      finish();
    });
    refresh(); return;
  }

  after(reduceMotion ? 0.25 : 0.7, () => {
    const e = { id: state.nextId++, type: key, tiles, axis, center: { x, z }, rounds: sp.duration, wraps: [] };
    if (key === 'vines') {
      for (const c of state.creatures) if (c.alive && inTiles(c)) { const saved = spellHit(sp, c, ''); if (!saved) e.wraps.push({ x: c.x, z: c.z, id: c.id }); }
    }
    state.effects.push(e);
    rebuildFxGrid();
    spawnVisual(e, false);
    if (key !== 'vines') after(0.35, () => {
      const dice = roll(sp.damage[0], sp.damage[1]);
      for (const c of state.creatures) if (c.alive && tiles.some(t => cheb(t, c) <= 1))
        spellHit(sp, c, key === 'firewall' ? 'Flames lash' : 'Erupting ice batters', dice);
      finish();
    });
    else after(0.3, finish);
    refresh(); save();
  });

}

/* --- inventory --- */
const invEntry = key => state.char.inventory.find(i => i.key === key);
function removeOne(key) {
  const c = state.char, it = invEntry(key); if (!it) return;
  it.qty--;
  if (it.qty <= 0) {
    c.inventory = c.inventory.filter(i => i !== it);
    for (const slot of ['weapon', 'armor', 'shield', 'head', 'neck', 'ammo']) if (c.equipped[slot] === key) c.equipped[slot] = null;
  }
}
function equip(key) {
  const c = state.char, item = ITEMS[key], eq = c.equipped;
  if (item.type === 'weapon') {
    eq.weapon = key;
    if (item.twoHanded && eq.shield) { eq.shield = null; toast(`${item.name} needs both hands, so you sling your shield.`); }
  } else if (item.type === 'armor') eq.armor = key;
  else if (item.type === 'ammo') { if (!c.inventory.some(i => i.key === 'shortbow')) toast('You need a bow to shoot these.'); eq.ammo = key; }
  else if (item.type === 'neck') eq.neck = key;
  else if (item.type === 'head') {
    if (isCursed()) { toast('The Drowned Crown won\'t come off, so nothing else fits.'); return; }
    eq.head = key;
    if (item.cursed && !c.curseLifted) {
      c.curseKnown = true;
      addLog('hit', `The <b>${item.name}</b> tightens around your skull. Cold water seems to fill your lungs for a heartbeat. <b>It's cursed</b>: it won't come off, and it will drain you.`);
      showModal(`The ${item.name} is cursed`, `<p>The moment it touches your brow, the black iron tightens. The stones glow violet, and you hear the sea.</p><p>${item.curseNote}</p>`, [{ label: 'Uh oh', primary: true }]);
      return;
    }
  } else if (item.type === 'shield') {
    eq.shield = key;
    if (eq.weapon && ITEMS[eq.weapon].twoHanded) { toast(`You stow the ${ITEMS[eq.weapon].name.toLowerCase()} to take up the shield.`); eq.weapon = null; }
  }
  addLog('', `Equipped <b>${item.name}</b>.`);
}
function unequip(slot) {
  const k = state.char.equipped[slot];
  if (slot === 'head' && isCursed()) return toast('The crown won\'t come off. It\'s cursed.');
  state.char.equipped[slot] = null; if (k) addLog('', `Unequipped <b>${ITEMS[k].name}</b>.`);
}
function useItem(key) {
  const item = ITEMS[key];
  if (item.type !== 'consumable') return;
  if (item.mana) {
    if (!exploring() && !state.turn.action) return toast('Drinking a potion takes your action, and it is already spent.');
    if (state.char.mp >= maxMpOf(state.char)) return toast('Your mana is already full.');
    if (!exploring()) state.turn.action = false;
    const dice = roll(item.mana[0], item.mana[1]), got = restoreMp(state.char, (sum(dice) + item.mana[2]) * (hasT(state.char, 'manaSpring') ? 2 : 1));
    floatText(`+${got} MP`, above(hero, 1.2), 'cold'); addLog('spell', `${item.name} [${dice.join(', ')}] +${item.mana[2]}: regain <b>${got}</b> mana.`);
    return removeOne(key);
  }
  if (!exploring() && !state.turn.action) return toast('Drinking a potion takes your action, and it is already spent.');
  if (state.char.hp >= derived().maxHp) return toast('You are already at full health.');
  if (!exploring()) state.turn.action = false;
  const [n, d, b] = item.heal, dice = roll(n, d);
  heal(sum(dice) + b + (hasT(state.char, 'healer') ? 4 : 0), `${item.name} [${dice.join(', ')}] +${b}${hasT(state.char, 'healer') ? ' +4 healer' : ''}`);
  removeOne(key);
}
function addItem(key, silent) {
  const it = invEntry(key);

  if (it) it.qty += n; else state.char.inventory.push({ key, qty: n });
  if (!silent) addLog('', `Added <b>${ITEMS[key].name}</b> to the pack.`);
}

const $ = id => document.getElementById(id);
// one message stack: newest at the bottom, four at most, each fading on its own
function toast(msg) {
  const box = $('toast'), last = box.lastElementChild;
  if (last && last.textContent === msg && !last.classList.contains('off')) { clearTimeout(last._t); last._t = setTimeout(() => fadeToast(last), 3200); return; }
  const el = document.createElement('div'); el.className = 'tmsg'; el.textContent = msg;
  box.appendChild(el); box.classList.remove('off');
  while (box.children.length > 4) box.firstElementChild.remove();
  el._t = setTimeout(() => fadeToast(el), 3200);
}
function fadeToast(el) { el.classList.add('off'); setTimeout(() => el.remove(), 350); }
const floats = [];

/* --- board picking --- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

function pick(e) {
  const r = canvas.getBoundingClientRect();

  raycaster.setFromCamera(ndc, camera);
  const targets = [hero];
  for (const v of views.values()) if (v.g.visible) targets.push(v.g);
  for (const v of allyViews.values()) targets.push(v.g);
  for (const m of tileMeshes) if (m && m.visible) targets.push(m);
  for (const p of props) if (p.o.visible) targets.push(p.o);
  const hit = raycaster.intersectObjects(targets, true).find(h => h.object.userData.kind && h.object.userData.kind !== 'deco' && shown(h.object));
  if (!hit) return null;
  const u = hit.object.userData;
  if (u.kind === 'tile' || u.kind === 'prop') {   // a lootable body is small: its whole square counts
    const body = state.creatures.find(c => !c.alive && c.loot && !c.looted && c.x === u.x && c.z === u.z);
    if (body) return { kind: 'corpse', cid: body.id, x: body.x, z: body.z };
  }
  if (u.kind === 'creature') { const c = creatureById(u.cid); if (!c) return null; if (!c.alive) return c.loot && !c.looted ? { kind: 'corpse', cid: c.id, x: c.x, z: c.z } : { kind: 'tile', x: c.x, z: c.z }; }
  return u;
}
const tileOf = p => !p ? null : p.kind === 'ally' ? { ...state.party.find(m => m.id === p.member).pos } : p.kind === 'creature' ? (c => ({ x: c.x, z: c.z }))(creatureById(p.cid)) : p.kind === 'hero' ? { ...state.pos } : { x: p.x, z: p.z };

hoverBox.visible = false; scene.add(hoverBox);

const dotMat = new THREE.MeshBasicMaterial({ color: '#d3aa55', toneMapped: false });

function clearPath() { pathDots.forEach(d => d.visible = false); hoverBox.visible = false; }
function showPath(x, z) {

}

function draftHero() {
  return { name: '', color: '#3f6f8f', skin: SKIN_TONES[1], hair: HAIR_COLORS[1], model: 'adventurer', kit: 'spellblade',
           base: { ...KITS.spellblade.scores }, rolled: null };
}
function charFromDraft(d) {
  const c = newCharacter();
  Object.assign(c, { name: d.name.trim() || 'Nameless wanderer', color: d.color, skin: d.skin, hair: d.hair, model: d.model });
  for (const [k] of ABILITIES) c.abilities[k] = d.rolled ? d.rolled[k] : d.base[k] + 1;
  applyKit(c, d.kit);
  return c;
}
const roll4d6 = () => { const r = roll(4, 6).sort((a, b) => a - b); return r[1] + r[2] + r[3]; };
function blankDungeon(name, w, h, dark) {
  const rows = Array.from({ length: h }, () => '#'.repeat(w).split(''));
  const rx = Math.floor(w / 2) - 3, rz = Math.floor(h / 2) - 2;
  for (let z = rz; z < rz + 5; z++) for (let x = rx; x < rx + 7; x++) rows[z][x] = '.';
  rows[rz + 2][rx + 3] = '@';
  return { name, desc: '', dark, fog: dark, sight: 7, custom: true, rev: 1, rows: rows.map(r => r.join('')),
    torches: [[rx + 1, rz - 1, 0, 1], [rx + 5, rz - 1, 0, 1]], loot: {}, chests: {}, stash: {}, secrets: {}, rooms: [], puzzleOrder: ['1', '2', '3'] };
}

$('screen').addEventListener('click', e => {

  if (go) return showScreen(go.dataset.go, go.dataset.go === 'creator' ? { nd: { name: '', from: 'blank', size: '24x18', dark: true } } : {});
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, k = b.dataset.k, h = id && heroById(id);
  switch (b.dataset.act) {

      run.party.forEach(m => migrateChar(m.char));
      if ((run.rev || 1) !== (MAPS[run.mapKey].rev || 1)) {
        const keep = { mode: run.partyMode, ids: run.party.map(m => m.heroId) };
        run = lead.run = freshState(run.mapKey, run.party.map(m => m.char)); run.partyMode = keep.mode; run.party.forEach((m, i) => { m.heroId = keep.ids[i]; });

    }
    case 'expedition': return showScreen('pick', { hero: id, map: h.run && MAPS[h.run.mapKey] ? h.run.mapKey : 'crypt', fresh: false });
    case 'askDelHero': scr.confirmDel = id; break;
    case 'delHero': heroes = heroes.filter(x => x !== h); saveHeroes(); scr.confirmDel = null; break;
    case 'newHero': return showScreen('newHero', { draft: draftHero() });
    case 'hModel': scr.draft.model = k; break;
    case 'hKit': scr.draft.kit = k; if (!scr.draft.rolled) scr.draft.base = { ...KITS[k].scores }; break;
    case 'exportAll': exportAll(); return;
    case 'hSkin': scr.draft.skin = k; break;
    case 'hHair': scr.draft.hair = k; break;
    case 'pb': { const d = scr.draft; d.base[k] = Math.max(8, Math.min(15, d.base[k] + +b.dataset.d)); break; }
    case 'rollScores': scr.draft.rolled = Object.fromEntries(ABILITIES.map(([a]) => [a, roll4d6()])); break;
    case 'pointBuy': scr.draft.rolled = null; break;
    case 'createHero': {
      const nh = { id: uid(), char: charFromDraft(scr.draft), run: null, updated: Date.now() };
      heroes.push(nh); saveHeroes();
      return showScreen('pick', { hero: nh.id, map: 'crypt', fresh: false });
    }
    case 'embark': {
      const hero = heroById(scr.hero), key = scr.map, members = [hero, ...(scr.companions || []).map(heroById).filter(Boolean)].slice(0, PARTY_MAX);
      const chars = members.map(m => {
        let c = m.char;
        if (scr.fresh) { const fresh = newCharacter(); for (const f of ['name', 'color', 'skin', 'hair', 'model', 'abilities', 'species', 'cls', 'kit']) fresh[f] = clone(c[f]); c = applyKit(fresh, fresh.kit); }
        c = clone(c); c.hp = maxHpOf(c); c.curseSteps = 0; return c;
      });
      hero.run = freshState(key, chars); hero.run.partyMode = scr.pmode || 'all';
      hero.run.party.forEach((m, i) => { m.heroId = members[i].id; members[i].char = m.char; });
      hero.inParty = null; hero.updated = Date.now();
      for (const m of members.slice(1)) { m.run = null; m.inParty = hero.id; m.updated = Date.now() - 1; }
      curHero = hero.id; enterPlay(hero.run, 'play', true);

    }
    case 'togComp': {
      const list = scr.companions ||= [];
      if (list.includes(id)) list.splice(list.indexOf(id), 1);
      else if (list.length >= PARTY_MAX - 1) { toast(`A party holds ${PARTY_MAX} adventurers at most.`); return; }
      else list.push(id);
      break;
    }
    case 'hire': { if ((scr.companions ||= []).length >= PARTY_MAX - 1) { toast(`A party holds ${PARTY_MAX} adventurers at most.`); return; } scr.companions.push(hireCompanion().id); break; }
    case 'pmode': scr.pmode = k; break;
    case 'ndFrom': scr.nd.from = k; break;
    case 'ndSize': scr.nd.size = k; break;
    case 'ndDark': scr.nd.dark = k === 'dark'; break;
    case 'ndCreate': {
      const d = scr.nd; let m;
      if (d.from === 'blank') { const [w, hh] = d.size.split('x').map(Number); m = blankDungeon(d.name.trim() || 'Untitled dungeon', w, hh, d.dark); }
      else { m = clone(MAPS[d.from]); m.name = d.name.trim() || `${m.name} (my version)`; m.custom = true; m.rev = 1; m.desc = ''; m.puzzleOrder = m.puzzle?.order;
        for (const f of ['next', 'hidden', 'floor', 'floors', 'title', 'finale']) delete m[f]; }
      const nid = uid(); m.updated = Date.now(); dungeons[nid] = finalizeMap(m); store.set(DUNGEON_KEY, dungeons); registerDungeons();

    case 'edit': return openEditor(id);
    case 'dup': { const m = clone(dungeons[id]); m.name += ' (copy)'; m.updated = Date.now(); dungeons[uid()] = m; store.set(DUNGEON_KEY, dungeons); registerDungeons(); break; }
    case 'export': exportDungeon(dungeons[id]); return;
    case 'askDelDungeon': scr.confirmDel = id; break;

// In the claude.ai viewer, files go out through the downloads capability; opened locally, a plain download link works
const downloadsCap = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function exportDungeon(m) {
  const text = JSON.stringify({ battleBoardDungeon: 1, map: m }, null, 1);
  const filename = (m.name || 'dungeon').replace(/[^\w -]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.json';
  const dl = await downloadsCap;
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Dungeon file saved. Friends can load it with Import in the Create menu.'); }
    catch (e) { if (e?.code === 'rate_limited') toast('A save prompt is already open.'); else if (e?.code !== 'declined') toast('Saving files isn\'t available here.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Dungeon file saved. Friends can load it with Import in the Create menu.');
}
function importDungeon(file) {
  file.text().then(t => {
    const j = JSON.parse(t), m = j.map || j;
    const okRows = Array.isArray(m.rows) && m.rows.length >= 4 && m.rows.length <= 60 && m.rows.every(r => typeof r === 'string' && r.length === m.rows[0].length && r.length <= 60);
    if (!okRows) throw new Error('bad');
    const legal = new Set('#.~DSGXCFI123$HTYZPp@rkbaWmdgevwlhjqcoKunBfszNQLRMAO'.split(''));
    m.rows = m.rows.map(r => [...r].map(ch => legal.has(ch) ? ch : '#').join(''));
    m.name = String(m.name || 'Imported dungeon').slice(0, 40); m.custom = true; m.rev = 1; m.updated = Date.now();
    m.rooms = (m.rooms || []).filter(a => a && Number.isInteger(a.x0)).map(a => ({ ...a, name: String(a.name || '').slice(0, 60), text: String(a.text || '').slice(0, 600) }));
    for (const f of ['loot', 'chests', 'stash']) for (const v of Object.values(m[f] || {})) v.items = (v.items || []).filter(i => ITEMS[i]);
    dungeons[uid()] = finalizeMap(m); store.set(DUNGEON_KEY, dungeons); registerDungeons();
    toast(`Imported ${m.name}.`); renderScreen();
  }).catch(() => toast('That file isn\'t a Battle Board dungeon.'));
}
