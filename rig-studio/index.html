<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Studio</title>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --panel2: #2b2f39; --line: #3a3f4c;
    --text: #dfe3ea; --dim: #8f97a6; --accent: #ffb454; --accent2: #5cc8ff; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .5px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--accent); color: #1b1d23; border-color: var(--accent); }
  button.primary { background: var(--accent2); color: #10222c; border-color: var(--accent2); font-weight: 600; }
  button.mini { padding: 1px 6px; font-size: 12px; }
  input[type=text], input[type=number] { width: 100%; min-width: 0; }
  main { display: grid; grid-template-columns: 230px 1fr 290px; min-height: 0; }
  aside { background: var(--panel); overflow-y: auto; padding: 8px; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  h2:first-child { margin-top: 2px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
  .row > label { flex: 0 0 74px; color: var(--dim); }
  .check { display: flex; gap: 6px; align-items: center; margin: 6px 0; color: var(--dim); }
  .list { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); max-height: 240px; overflow-y: auto; }
  .item { padding: 3px 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: #4a3a1c; color: var(--accent); }
  .item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item .tag { color: var(--dim); font-size: 11px; }
  .bone-ico { color: var(--accent2); } .slot-ico { color: #9be28a; }
  .lib { display: grid; gap: 6px; }
  .lib .card { display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
  .lib img { width: 44px; height: 44px; object-fit: contain; background:
    repeating-conic-gradient(#333 0 25%, #2a2a2a 0 50%) 0 0/12px 12px; border-radius: 3px; cursor: grab; }
  .lib .btns { display: flex; gap: 3px; margin-top: 3px; }
  .empty { color: var(--dim); padding: 8px; font-style: italic; }
  footer { padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; width: min(920px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  #sliceCanvas { max-width: 100%; max-height: 60vh; display: block; margin: 8px auto; border: 1px solid var(--line);
    background: repeating-conic-gradient(#333 0 25%, #2a2a2a 0 50%) 0 0/16px 16px; cursor: crosshair; touch-action: none; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar input[type=number] { width: 64px; }
  #modeBadge { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 4px 12px;
    border-radius: 12px; background: var(--accent); color: #1b1d23; font-weight: 600; display: none; pointer-events: none; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>RIG STUDIO</h1>
  <input id="docName" type="text" style="width:130px" title="Character name (used for exported file names)">
  <span class="sep"></span>
  <button id="btnNew">New</button>
  <button id="btnOpen">Open…</button>
  <button id="btnSave">Save project</button>
  <button id="btnSample" title="Load a ready-made example puppet">Sample</button>
  <span class="sep"></span>
  <button id="btnImport" title="Add separate part images (PNG)">Import parts…</button>
  <button id="btnSlice" title="Cut one image into separate parts">Slice image…</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Ctrl+Z">Undo</button>
  <button id="btnRedo" title="Ctrl+Y">Redo</button>
  <span style="flex:1"></span>
  <button id="btnExport" class="primary">Export for Godot</button>
  <input id="fileImages" type="file" accept="image/*" multiple hidden>
  <input id="fileSheet" type="file" accept="image/*" hidden>
  <input id="fileProject" type="file" accept=".rigproj,application/json" hidden>
</header>

<main>
  <aside id="left">
    <h2>Tools</h2>
    <div class="tools">
      <button data-tool="select" title="Select / move (V)">Move</button>
      <button data-tool="rotate" title="Rotate (R)">Rotate</button>
      <button data-tool="bone" title="Draw bones (B)">Bone</button>
    </div>
    <h2>Mode</h2>
    <div class="tools" style="grid-template-columns:1fr 1fr">
      <button data-mode="setup" title="Build the rig">Setup</button>
      <button data-mode="pose" title="Try out the rig without changing it (P)">Pose test</button>
    </div>
    <label class="check" title="Move or rotate a bone without dragging its art and child bones along. Use it to fix a pivot.">
      <input id="chkCompensate" type="checkbox"> Adjust bone only (keep art in place)</label>
    <label class="check"><input id="chkBones" type="checkbox" checked> Show bones</label>
    <button id="btnAutoBind" style="width:100%" title="Attach every part that is still on the root bone to the bone nearest to it">Auto-bind parts to bones</button>
    <h2>Part library</h2>
    <div id="library" class="lib"></div>
  </aside>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="modeBadge">POSE TEST — changes here are not saved</div>
  </div>

  <aside id="right">
    <h2>Skeleton</h2>
    <div id="tree" class="list"></div>
    <h2>Draw order <span><button class="mini" id="btnFront" title="Bring forward ( ] )">▲</button>
      <button class="mini" id="btnBack" title="Send backward ( [ )">▼</button></span></h2>
    <div id="order" class="list"></div>
    <h2>Properties</h2>
    <div id="props"></div>
    <h2>Skins <button class="mini" id="btnSkinAdd" title="Save which part is showing in every slot as a named skin">+ Save current look</button></h2>
    <div id="skins" class="list"></div>
  </aside>
</main>

<footer id="status"></footer>

<dialog id="slicer">
  <div class="bar">
    <strong>Slice image into parts</strong>
    <span style="flex:1"></span>
    <label>Merge gap <input id="sliceGap" type="number" min="0" max="64" value="2"></label>
    <label>Min size <input id="sliceMin" type="number" min="1" max="256" value="6"></label>
    <button id="sliceDetect">Auto-detect</button>
  </div>
  <canvas id="sliceCanvas"></canvas>
  <div class="bar">
    <span id="sliceInfo" style="color:var(--dim)"></span>
    <span style="flex:1"></span>
    <button id="sliceMerge">Merge selected</button>
    <button id="sliceDelete">Delete selected</button>
  </div>
  <p style="color:var(--dim);margin:8px 0">Auto-detect finds pieces separated by transparency. Drag to add a rectangle by hand;
    click a piece to select it (Shift for several).</p>
  <div class="bar">
    <label class="check" style="margin:0"><input id="slicePlace" type="checkbox" checked> Place parts on the canvas where they sit in the image</label>
    <span style="flex:1"></span>
    <button id="sliceCancel">Cancel</button>
    <button id="sliceOk" class="primary">Create parts</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
